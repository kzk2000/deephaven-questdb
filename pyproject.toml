[project]
name = "deephaven-questdb"
version = "0.1.0"
description = "Deephaven + QuestDB real-time streaming"
requires-python = ">=3.10"
authors = [
    {name = "kzk2000"}
]

[project.optional-dependencies]
# Note: ruff and pytest are run via uvx (no installation needed)
# Install with: pip install -e ".[cryptofeed]" or pip install -e ".[deephaven]"

# cryptofeed 3.x needs Python >= 3.13 (the cryptofeed image is python:3.13); keep in sync with
# docker/cryptofeed/requirements.txt
cryptofeed = [
    "cryptofeed==3.0.1",
    "questdb==5.0.0",
]

# keep in sync with docker/deephaven/Dockerfile (pyarrow etc. come with the Deephaven base image)
deephaven = [
    "questdb==5.0.0",
    "pyarrow",
    "connectorx==0.4.6",
    "SQLAlchemy==2.1.4",
    "psycopg2-binary==2.9.13",
    "deephaven-plugin-tradingview-lightweight==0.0.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No importable package at the repo root; this file only carries deps and tool config
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py310"
required-version = "==0.17.0"
# Python only: ruff would otherwise reformat code blocks in the markdown docs
extend-exclude = ["*.md", "data/questdb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, Pyflakes, isort
# E501: the formatter does not wrap long strings/docstrings, so line length is left to ruff format
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests put docker/cryptofeed/src on sys.path before importing the writer
"docker/cryptofeed/tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["docker/cryptofeed/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
