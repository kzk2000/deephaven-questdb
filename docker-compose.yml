services:
  deephaven:
    container_name: deephaven
    build:
      context: docker/deephaven
    environment:
      START_OPTS: -Xmx12g -Dio.deephaven.app.GcApplication.enabled=true -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler
    ports:
      - "10000:10000"
    volumes:
      - ./data/deephaven:/data/storage
      - ./data/parquet:/data/parquet
    depends_on:
      questdb:
        condition: service_healthy
    networks:
      - quest_ntw

  questdb:
    container_name: questdb
    image: questdb/questdb:10.0.1
    environment:
      # Column files are preallocated in append pages of this size (default 16M). A 42-column
      # table with a few thousand rows occupied ~700 MB; 1M brings it to ~44 MB.
      QDB_CAIRO_WRITER_DATA_APPEND_PAGE_SIZE: 1M
      # Worker pools default to one thread per core (12) in each of the network, write and query
      # pools; at ~300 rows/s they spin on the constant trickle of small commits and held ~6.6
      # cores. Sized for this load instead (measured: see CLAUDE.md "QuestDB CPU").
      QDB_SHARED_NETWORK_WORKER_COUNT: 2
      QDB_SHARED_WRITE_WORKER_COUNT: 4
      QDB_SHARED_QUERY_WORKER_COUNT: 4
      QDB_WAL_APPLY_WORKER_COUNT: 2
      QDB_MAT_VIEW_REFRESH_WORKER_COUNT: 1
      # one INFO line per query and per WAL commit was ~900 log lines/s
      QDB_LOG_SQL_QUERY_PROGRESS_EXE: "false"
      QDB_LOG_W_STDOUT_LEVEL: ERROR
    ports:
      - 8812:8812
      - 9000:9000
      - 9009:9009
    volumes:
      - ./data/questdb:/var/lib/questdb
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2328' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - quest_ntw

  cryptofeed:
    container_name: cryptofeed
    build:
      context: docker/cryptofeed
    environment:
      # ms a row may wait in the client buffer; each flush is one QuestDB WAL commit
      QUESTDB_AUTO_FLUSH_MS: 250
    depends_on:
      questdb:
        condition: service_healthy
    networks:
      - quest_ntw

networks:
  quest_ntw:
    driver: bridge
    ipam:
      config:
        - subnet: 100.223.1.0/24